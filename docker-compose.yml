services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geotwin
      POSTGRES_PASSWORD: geotwin
      POSTGRES_DB: geotwinverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotwin -d geotwinverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://geotwin:geotwin@postgres:5432/geotwinverse
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEBUG: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: geotwinverse
      OIDC_ISSUER: http://localhost:8081
      OIDC_CLIENT_ID: geotwinverse-dev
      OIDC_REDIRECT_URI: http://localhost:3000/oidc/callback
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg2://geotwin:geotwin@postgres:5432/geotwinverse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    profiles: ["worker"]

  flower:
    build: ./backend
    command: celery -A app.worker.celery_app flower --port=5555
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    profiles: ["worker"]

  oidc:
    build: ./backend
    command: uvicorn app.oidc_dev:app --host 0.0.0.0 --port 8081
    ports:
      - "8081:8081"
    profiles: ["sso"]

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/geotwinverse
    ports:
      - "7474:7474"
      - "7687:7687"
    profiles: ["graph"]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    profiles: ["edge"]

volumes:
  pgdata:
