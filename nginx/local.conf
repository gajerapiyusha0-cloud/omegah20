pid /tmp/geotwin-nginx/nginx.pid;
error_log /tmp/geotwin-nginx.error.log;
worker_processes 1;
daemon on;

events {
  worker_connections 128;
}

http {
  client_body_temp_path /tmp/geotwin-nginx/body;
  proxy_temp_path /tmp/geotwin-nginx/proxy;
  fastcgi_temp_path /tmp/geotwin-nginx/fastcgi;
  uwsgi_temp_path /tmp/geotwin-nginx/uwsgi;
  scgi_temp_path /tmp/geotwin-nginx/scgi;
  access_log /tmp/geotwin-nginx.access.log;
  server {
    listen 127.0.0.1:8080;

    location /api/ {
      proxy_pass http://127.0.0.1:8000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location /docs {
      proxy_pass http://127.0.0.1:8000/docs;
    }

    location /metrics {
      proxy_pass http://127.0.0.1:8000/metrics;
    }

    location / {
      proxy_pass http://127.0.0.1:3000/;
      proxy_set_header Host $host;
    }
  }
}
